spring:
  application:
    name: error-free-text
  datasource:
    url: jdbc:postgresql://localhost:5432/error_free_text
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

yandex:
  speller:
    url: https://speller.yandex.net/services/spellservice.json/checkTexts
    max-chunk-size: 10000

task:
  scheduler:
    interval-ms: 5000

logging:
  level:
    com.errorfreetext: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
